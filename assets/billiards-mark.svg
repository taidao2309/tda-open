
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title">
  <title id="title">TDA Billiards mark</title>
  <defs>
    <radialGradient id="shine" cx="38%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="45%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- cue stick behind the rack -->
  <g stroke-linecap="round">
    <line x1="7" y1="55" x2="57" y2="30" stroke="#07110d" stroke-width="5.4" opacity=".25"/>
    <line x1="7" y1="55" x2="57" y2="30" stroke="#e8e2c9" stroke-width="3.4"/>
    <line x1="45" y1="37.5" x2="57" y2="30" stroke="#153b2a" stroke-width="3.4"/>
    <circle cx="57" cy="30" r="2.4" fill="#C8F536"/>
  </g>

  <!-- left ball (1) -->
  <g>
    <circle cx="18" cy="31" r="10.5" fill="#ecebdc" stroke="#07110d" stroke-width="1.4"/>
    <circle cx="18" cy="31" r="10.5" fill="url(#shine)"/>
    <circle cx="18" cy="29.5" r="4.6" fill="#fff"/>
    <text x="18" y="32.7" fill="#07110d" font-family="Georgia,serif" font-size="7" font-weight="700" text-anchor="middle">1</text>
  </g>

  <!-- right ball (2) -->
  <g>
    <circle cx="46" cy="31" r="10.5" fill="#C8F536" stroke="#07110d" stroke-width="1.4"/>
    <circle cx="46" cy="31" r="10.5" fill="url(#shine)"/>
    <circle cx="46" cy="29.5" r="4.6" fill="#fff"/>
    <text x="46" y="32.7" fill="#07110d" font-family="Georgia,serif" font-size="7" font-weight="700" text-anchor="middle">2</text>
  </g>

  <!-- center 8-ball -->
  <g>
    <circle cx="32" cy="24" r="13" fill="#07110d" stroke="#C8F536" stroke-width="2.2"/>
    <circle cx="32" cy="24" r="13" fill="url(#shine)"/>
    <circle cx="32" cy="22" r="6" fill="#f4f2e7"/>
    <text x="32" y="25" fill="#07110d" font-family="Georgia,serif" font-size="9" font-weight="700" text-anchor="middle">8</text>
  </g>
</svg>
