<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020c06">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="alternate icon" type="image/png" href="assets/favicon.png">
  <title>Admin Bình Chọn — TDA Open 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;0,900;1,700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=36">
  <style>
    html, body { background: #020c06; min-height: 100vh; overflow-x: clip; }

    /* ── Topbar (matches draw.html) ── */
    .va-topbar {
      position: fixed; top: 0; left: 0; right: 0; height: 64px; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 24px; background: rgba(2,12,6,.85);
      backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255,255,255,.06);
    }
    .va-topbar .brand-logo { height: 28px; width: auto; }
    .va-back-btn {
      display: inline-flex; align-items: center; gap: 7px;
      color: rgba(255,255,255,.55); font: 600 13px var(--sans);
      text-decoration: none; padding: 7px 14px; border-radius: 999px;
      border: 1px solid rgba(255,255,255,.12); transition: color .18s, border-color .18s;
    }
    .va-back-btn:hover { color: #fff; border-color: rgba(255,255,255,.3); }
    .va-back-btn svg { width: 14px; height: 14px; }

    /* ── Main layout ── */
    .va-screen { padding-top: 64px; min-height: 100vh; }

    /* ── State: loading ── */
    .va-state { display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: calc(100vh - 64px); gap: 16px; }
    .va-state p { color: rgba(255,255,255,.45); font: 500 15px var(--sans); }
    .va-spin {
      width: 36px; height: 36px; border: 3px solid rgba(200,245,54,.15);
      border-top-color: #c8f536; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── State: empty (create session) ── */
    .va-create-box {
      display: flex; flex-direction: column; align-items: center; gap: 20px;
      padding: 48px 32px; text-align: center;
    }
    .va-create-icon { font-size: 48px; }
    .va-create-box h2 {
      font: 800 28px var(--barlow); letter-spacing: 2px; text-transform: uppercase;
      color: rgba(255,255,255,.85); margin: 0;
    }
    .va-create-box p { color: rgba(255,255,255,.4); font: 400 14px var(--sans); margin: 0; max-width: 320px; }
    .va-create-btn {
      display: inline-flex; align-items: center; gap: 10px;
      background: #c8f536; color: #020c06; font: 700 14px var(--sans);
      padding: 14px 32px; border-radius: 999px; border: none; cursor: pointer;
      transition: background .18s, transform .12s;
    }
    .va-create-btn:hover { background: #d9f84d; transform: translateY(-1px); }

    /* ── Active session layout ── */
    .va-active {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 0;
      min-height: calc(100vh - 64px);
    }

    /* ── Left panel: QR + controls ── */
    .va-left {
      background: rgba(255,255,255,.025);
      border-right: 1px solid rgba(255,255,255,.07);
      padding: 32px 24px;
      display: flex; flex-direction: column; gap: 24px;
    }

    .va-status-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .va-badge {
      font: 800 11px var(--barlow); letter-spacing: 2px; text-transform: uppercase;
      padding: 5px 12px; border-radius: 999px;
    }
    .va-badge.va-open { background: rgba(200,245,54,.15); color: #c8f536; border: 1px solid rgba(200,245,54,.35); }
    .va-badge.va-ended { background: rgba(255,255,255,.07); color: rgba(255,255,255,.4); border: 1px solid rgba(255,255,255,.12); }
    .va-announced {
      font: 600 11px var(--sans); color: rgba(103,213,255,.8);
      background: rgba(103,213,255,.1); padding: 4px 10px; border-radius: 999px;
    }
    .va-vote-total {
      font: 700 13px var(--barlow); color: rgba(255,255,255,.55); letter-spacing: 1px;
      margin-left: auto;
    }

    /* ── QR block ── */
    .va-qr-block {
      background: #fff; border-radius: 16px; padding: 20px;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    #vaQR { line-height: 0; }
    #vaQR canvas, #vaQR img { border-radius: 4px; display: block; }
    .va-url {
      font: 600 10px var(--sans); color: #333; word-break: break-all;
      text-align: center; margin: 0;
    }

    /* ── Action buttons ── */
    .va-actions { display: flex; flex-direction: column; gap: 10px; }
    .va-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 12px 20px; border-radius: 999px; font: 700 13px var(--sans);
      cursor: pointer; border: none; transition: background .18s, transform .12s;
    }
    .va-btn:hover { transform: translateY(-1px); }
    .va-btn-primary { background: #c8f536; color: #020c06; }
    .va-btn-primary:hover { background: #d9f84d; }
    .va-btn-danger { background: rgba(255,80,80,.12); color: #ff7070; border: 1px solid rgba(255,80,80,.25); }
    .va-btn-danger:hover { background: rgba(255,80,80,.2); }
    .va-btn-ghost { background: rgba(255,255,255,.06); color: rgba(255,255,255,.65); border: 1px solid rgba(255,255,255,.1); }
    .va-btn-ghost:hover { background: rgba(255,255,255,.1); color: #fff; }
    .va-btn:disabled { opacity: .4; cursor: default; transform: none; }

    /* ── Right panel: results ── */
    .va-right { padding: 32px 32px; display: flex; flex-direction: column; gap: 20px; }

    .va-results-hd {
      font: 800 13px var(--barlow); letter-spacing: 3px; text-transform: uppercase;
      color: rgba(255,255,255,.35);
    }

    .va-results { display: flex; flex-direction: column; gap: 8px; }

    .va-no-votes { color: rgba(255,255,255,.25); font: 400 14px var(--sans); }

    .va-row {
      display: grid; grid-template-columns: 32px 1fr auto 160px 48px;
      align-items: center; gap: 10px; padding: 12px 16px;
      background: rgba(255,255,255,.03); border: 1px solid rgba(255,255,255,.06);
      border-radius: 10px; transition: background .15s;
    }
    .va-row.va-row-top {
      background: rgba(200,245,54,.06); border-color: rgba(200,245,54,.2);
    }
    .va-row:hover { background: rgba(255,255,255,.05); }
    .va-pos { font: 800 14px var(--barlow); color: rgba(255,255,255,.25); text-align: center; }
    .va-row.va-row-top .va-pos { color: #c8f536; }
    .va-pname { font: 500 15px var(--sans); color: rgba(255,255,255,.85); white-space: nowrap; }
    .va-prank { flex-shrink: 0; }
    .va-bar-w { height: 6px; background: rgba(255,255,255,.08); border-radius: 3px; overflow: hidden; }
    .va-bar { height: 100%; background: rgba(200,245,54,.5); border-radius: 3px; transition: width .4s; }
    .va-row.va-row-top .va-bar { background: #c8f536; }
    .va-pcount { font: 700 15px var(--barlow); color: rgba(255,255,255,.6); text-align: right; }
    .va-row.va-row-top .va-pcount { color: #c8f536; }

    @media (max-width: 768px) {
      .va-active { grid-template-columns: 1fr; }
      .va-left { border-right: none; border-bottom: 1px solid rgba(255,255,255,.07); }
      .va-row { grid-template-columns: 28px 1fr auto 80px 36px; }
    }
  </style>
</head>
<body>

  <header class="va-topbar">
    <a href="index.html">
      <img class="brand-logo" src="assets/tda-logo.png" width="1147" height="848" alt="TDA Billiards">
    </a>
    <a href="index.html" class="va-back-btn">
      <svg viewBox="0 0 16 16" fill="none" aria-hidden="true">
        <path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      Trang chủ
    </a>
  </header>

  <main class="va-screen" id="vaScreen">
    <div class="va-state" id="vaLoading">
      <div class="va-spin"></div>
      <p>Đang kết nối...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="tournament-data.js?v=3"></script>
  <script src="vote-admin.js?v=1"></script>
</body>
</html>
